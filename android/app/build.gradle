plugins {
    id 'com.android.application'
}

android {
    namespace 'co.groogle.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "co.groogle.iptv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: ""
            keyAlias      System.getenv("KEY_ALIAS")     ?: "iptv"
            keyPassword   System.getenv("KEY_PASS")      ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Amazon In-App Purchasing SDK — add manually when ready:
    // 1. Download from developer.amazon.com/apps-and-games/sdk-download
    // 2. Copy the .aar into android/app/libs/
    // 3. Uncomment the line below
    // implementation fileTree(dir: 'libs', include: ['*.aar'])
}
